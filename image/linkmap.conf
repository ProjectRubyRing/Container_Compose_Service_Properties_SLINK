# ============================================================================
# linkmap.conf  --  共有設定ファイル マップ (front / back 共通)
# ============================================================================
#
# 書式 (空白 or TAB 区切り / '#' 以降はコメント / 空行は無視):
#
#   <LINK>  <TARGET>  [<DEFAULT>]
#
#   LINK     : コンテナイメージ内に作成する「シンボリックリンク」の絶対パス。
#              readonlyRootFilesystem=true の配下なので **ビルド時にのみ** 作成可能。
#   TARGET   : EFS 上に置く「実体ファイル」の絶対パス。
#              全サービス / front / back で共通の1ファイルを指す。
#   DEFAULT  : イメージ内に退避しておく「初期値(シード元)」の絶対パス。
#              省略 or '-' の場合は  ${DEFAULTS_DIR}/<LINK から ${APP_ROOT} を除いた相対パス>
#              に自動で決定される (ファイル名衝突が起きない)。
#
# 使用可能なトークン (build-shared-links.sh / shared-conf-entrypoint.sh が展開):
#   ${APP_ROOT}          例: /webapp/webapp9mf02   (front) / /webapp/webapp9mb02 (back)
#   ${SHARED_CONF_DIR}   例: /mnt/logs/tmp
#   ${DEFAULTS_DIR}      例: /opt/app/shared-conf/defaults
#
# ---- 新しいファイルを共有化したくなったら、この下に1行足すだけ ----------------
#
# LINK                                                          TARGET                                        DEFAULT
${APP_ROOT}/servlets/jp/co/sample/base/date_config.properties   ${SHARED_CONF_DIR}/date_config.properties     -

