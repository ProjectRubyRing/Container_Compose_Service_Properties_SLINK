# ============================================================================
# linkmap.conf  --  共有設定ファイル マップ (front / back 共通)
# ============================================================================
#
# 書式 (空白 or TAB 区切り / '#' 以降はコメント / 空行は無視):
#
#   <LINK>  <TARGET>  [<DEFAULT>]  [<OVERLAY_PATH>]
#
#   LINK     : コンテナイメージ内に作成する「シンボリックリンク」の絶対パス。
#              readonlyRootFilesystem=true の配下なので **ビルド時にのみ** 作成可能。
#              SHARED_CONF_SYMLINK=off のときは「そのまま残す実ファイル」の位置。
#   TARGET   : EFS 上に置く「実体ファイル」の絶対パス。
#              全サービス / front / back で共通の1ファイルを指す。
#   DEFAULT  : イメージ内に退避しておく「初期値(シード元)」の絶対パス。
#              省略 or '-' の場合は  ${DEFAULTS_DIR}/<LINK から ${APP_ROOT} を除いた相対パス>
#              に自動で決定される (ファイル名衝突が起きない)。
#   OVERLAY_PATH :
#              【SHARED_CONF_OVERLAY=on のときだけ使う / 通常は '-' でよい】
#              Deployment Overlay で上書きする **アーカイブ内の相対パス**。
#              例: WEB-INF/classes/jp/co/sample/base/date_config.properties
#              '-' (既定) なら deployment browse-content で配備内容を実測し、
#              同名ファイルを自動で探し当てる (複数ヒットすれば全部が対象)。
#              絶対パス (先頭 '/') はエラーになる。
#
# 使用可能なトークン (LINK / TARGET / DEFAULT で展開される):
#   ${APP_ROOT}          例: /webapp/webapp9mf02   (front) / /webapp/webapp9mb02 (back)
#   ${SHARED_CONF_DIR}   例: /mnt/logs/tmp
#   ${DEFAULTS_DIR}      例: /opt/app/shared-conf/defaults
#
# ---- 新しいファイルを共有化したくなったら、この下に1行足すだけ ----------------
#
# LINK                                                          TARGET                                        DEFAULT  OVERLAY_PATH
${APP_ROOT}/servlets/jp/co/sample/base/date_config.properties   ${SHARED_CONF_DIR}/date_config.properties     -        -

# --- 追加例 (コメントアウト) -------------------------------------------------
#${APP_ROOT}/servlets/jp/co/sample/base/holiday_config.properties  ${SHARED_CONF_DIR}/holiday_config.properties  -  -
#${APP_ROOT}/servlets/jp/co/sample/base/message_config.properties  ${SHARED_CONF_DIR}/message_config.properties  -  -
#
# --- アーカイブ内パスを明示する例 (browse-content を使わず固定したい場合) ------
#${APP_ROOT}/servlets/jp/co/sample/base/date_config.properties  ${SHARED_CONF_DIR}/date_config.properties  -  WEB-INF/classes/jp/co/sample/base/date_config.properties
